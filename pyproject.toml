[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dartfx-docker-api-base"
version = "0.2.0"
license = { text = "MIT" }
dependencies = ["fastapi", "uvicorn[standard]"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
